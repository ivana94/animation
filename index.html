<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animation</title>
  <style>

   body {
  margin: 0;
  height: 100vh;
  background-color: #050210;
  display: flex;
  justify-content: center;
  align-items: center;
}

.circle {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: linear-gradient(45deg, #fb5dad, #55fb9f, #b97aff);
  animation: spin 4s linear infinite;
  position: relative;
  z-index: 1;
}

.circle::before {
  content: '';
  position: absolute;
  top: 15px;
  left: 15px;
  width: 170px;
  height: 170px;
  background-color: #050210;
  border-radius: 50%;
  z-index: -1;
}

.circle::after {
  content: '';
  position: absolute;
  top: -10px;
  left: -10px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: linear-gradient(360deg, #fb5dad, #55fb9f, #b97aff);
  filter: blur(30px);
  animation: spin 2s linear infinite;
  z-index: -2;
}

@keyframes spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
      transform: rotate(360deg);
    }
  }
  

  </style>
</head>
<body>
  <div class="circle"></div>
  </div>
</body>
</html>
